name: Gunluk BES Raporu Otomasyonu

on:
  schedule:
    # Her gün Türkiye saatiyle 19:30'da otomatik çalışır (UTC 16:30)
    - cron: '30 16 * * *'
  workflow_dispatch: # Manuel çalıştırma butonu ekler

# GitHub Pages'e doğrudan yükleme yapabilmek için gereken en yüksek sunucu izinleri
permissions:
  contents: write
  pages: write
  id-token: write

# Aynı anda birden fazla çalışma çakışırsa eskiyi iptal eder, hızı artırır
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Kutuphaneleri Yukle
      run: |
        python -m pip install --upgrade pip
        pip install pandas reportlab

    - name: Web Sayfasini Uret
      run: python main.py

    - name: GitHub Pages Altyapisini Kur
      uses: actions/configure-pages@v3

    - name: Sayfa Arsirini Yukle
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'

    - name: Web Sitesini Canliya Al (Garantili Motor)
      id: deployment
      uses: actions/deploy-pages@v4
