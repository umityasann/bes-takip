name: Gunluk BES Raporu Otomasyonu

on:
  schedule:
    # Her gün Türkiye saatiyle 19:30'da otomatik çalışır (UTC 16:30)
    - cron: '30 16 * * *'
  workflow_dispatch: # Manuel çalıştırma butonu ekler

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Kutuphaneleri Yukle
      run: |
        python -m pip install --upgrade pip
        pip install pandas reportlab pytefas

    - name: Web Sayfasini Uret
      run: python main.py

    - name: Web Sitesini İnternete Firlat (Klasik Guvenli Motor)
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: public
        branch: gh-pages
