name: Gunluk BES Raporu Otomasyonu

on:
  schedule:
    # Her akşam 19:30 (Türkiye saati / UTC+3) -> UTC 16:30
        - cron: '0 4-16 * * 1-5'
  workflow_dispatch: # Manuel çalıştırma butonu ekler

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Kutuphaneleri Yukle
      run: |
        python -m pip install --upgrade pip
        pip install pandas reportlab pytefas yfinance

    - name: Web Sayfasini Uret (BES)
      run: python main.py

    - name: Midas Sayfasini Uret
      run: python midas.py

    - name: Gecmis Veriyi Commit Et
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/history.json
        git diff --staged --quiet || git commit -m "Gunluk veri guncellendi $(date +'%Y-%m-%d')"
        git push

    - name: Web Sitesini İnternete Firlat (Klasik Guvenli Motor)
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: public
        branch: gh-pages
