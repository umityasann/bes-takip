name: Gunluk BES Raporu Otomasyonu

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutuphaneleri Yukle
        run: pip install -r requirements.txt

      - name: Web Sayfasini Uret
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python main.py

      - name: Gecmis Veriyi Commit Et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet || git commit -m "Gunluk veri guncellendi $(date +'%Y-%m-%d')"
          git push

      - name: Pages Ayarla
        uses: actions/configure-pages@v5

      - name: Sayfa Arsivini Yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Web Sitesini Canliya Al
        id: deployment
        uses: actions/deploy-pages@v4
