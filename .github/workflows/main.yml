name: Gunluk BES Raporu Otomasyonu

on:
  schedule:
    # Her gun Turkiye saatiyle 19:30'da otomatik calisir (UTC 16:30)
    - cron: '30 16 * * *'
  workflow_dispatch: # Manuel calistirma butonu ekler

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Kutuphaneleri Yukle
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas openpyxl

    - name: Raporu Calistir
      run: python main.py

    - name: Olusan Excel Dosyasini GitHub'a Yukle
      uses: actions/upload-artifact@v4
      with:
        name: Gunluk-BES-Excel-Raporu
        path: "*.xlsx"
